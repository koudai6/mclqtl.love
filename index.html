<style>

.mp>.av{width:42px;height:42px;border-radius:8px;align-self:flex-start}
.mp .mb{flex:1;min-width:0}
.mp .mn{color:#576b95;font-weight:700;font-size:15px;margin-bottom:3px}
.mp .mg.g1{grid-template-columns:70%}
.mtm{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--ink2);position:relative}
.mmore{width:34px;height:22px;border-radius:5px;background:rgba(125,147,178,.22);color:#576b95;font-weight:700;line-height:1;font-size:15px;letter-spacing:1px}
.mpop{display:none;position:absolute;right:40px;top:50%;transform:translateY(-50%);background:rgba(61,90,128,.96);border-radius:6px;overflow:hidden;z-index:2}

.mpop button{color:#fff;padding:7px 14px;font-size:13px;white-space:nowrap}

.mp .mx .ml{color:#576b95;margin-bottom:2px}
.mc b{color:#576b95;font-weight:600}
#bn{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 8px);z-index:40;border-radius:22px;padding:10px 14px;display:flex;gap:10px;align-items:center;transform:translateY(calc(-100% - env(safe-area-inset-top) - 30px));opacity:0;pointer-events:none;transition:.35s;background:rgba(244,249,255,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--sh)}
#bn.on{transform:none;opacity:1;pointer-events:auto}
.bt{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.m.pay{background:linear-gradient(145deg,#a7c4ea,#7f9fd1);min-width:236px;padding:0;overflow:hidden;border-radius:18px}
.m.pay.dn{opacity:.88}
.m.pay.rj{background:linear-gradient(145deg,#c6cfdc,#a9b5c7)}
.pt{display:flex;gap:12px;align-items:center;padding:15px 16px 13px}

.tfa{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:12px 0 14px;padding-bottom:8px;border-bottom:1px solid rgba(125,147,178,.35)}
.tfa span{font-size:30px}.tfa input{font-size:40px;width:180px}
.skg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sk{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.55)}
.sk img{width:100%;height:100%;object-fit:contain}
.sk i{display:none;position:absolute;right:6px;top:6px;width:20px;height:20px;border-radius:50%;border:2px solid #fff;background:rgba(255,255,255,.4)}
.skg.sel .sk i{display:block}.sk.on i{background:var(--acc)}.sk.on{outline:2px solid var(--acc);outline-offset:-2px}
.m.pic.stk img{max-width:110px;max-height:110px;object-fit:contain}
</style>

<body>

<div id="home">
  <div class="wg glass" id="calw"></div>
  <div class="grid" id="apps"></div>
  <div class="dock glass" id="dock"></div>
</div>

<!-- 聊天 -->
<div class="pg" id="p-chat">
  <div class="bar glass"><button class="ib" data-back><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2 id="cname"></h2><button class="ib" id="callbtn"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg></button><button class="ib" id="cset"><svg viewBox="0 0 24 24" style="fill:var(--ink)"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button></div>
  <div class="body" id="msgbody"><div id="msgs"></div></div>
  <div class="inp"><button class="ib glass" id="plus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><textarea id="ta" rows="1"></textarea><button class="ib glass" id="snd"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-7z"/></svg></button></div>
</div>

<!-- 通用页 -->
<div class="pg" id="p-gen">
  <div class="bar glass"><button class="ib" data-back><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2 id="gt"></h2><button class="ib" id="gadd"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
  <div class="body" id="gb"></div>
</div>

<div class="pg" id="p-todo">
  <div class="bar glass"><button class="ib" data-back><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2 id="td-title"></h2><button class="ib" id="td-add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
  <div id="td-week" class="glass"></div>
  <div class="tdh"><button class="ib" id="td-prev"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><div id="td-sub"></div><button class="chip" id="td-today">今天</button><button class="ib" id="td-next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div>
  <div class="body" id="td-body"><div id="td-tl"></div></div>
</div>

<div class="pg" id="p-doc">
  <div class="dbar"><button class="ib" id="doc-back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><div id="doc-title"></div><div id="doc-act"></div></div>
  <div class="body" id="doc-body"></div>
</div>

<div class="pg" id="p-stk" style="z-index:12"><div class="bar glass"><button class="ib" id="sk-b"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2>表情包</h2><button class="btn" id="sk-sel" style="padding:7px 12px">选择</button><button class="ib" id="sk-add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div><div class="body" id="sk-body"></div><div class="inp" id="sk-act" style="display:none;justify-content:center;gap:12px"><button class="btn" id="sk-all">全选</button><button class="btn p" id="sk-del">删除</button></div></div>
<div class="pg" id="call"></div>
<div id="cpill"></div>
<div id="bn"></div>
<div class="mask" id="mask"><div class="box" id="box"></div></div>
<div id="toast"></div>
<input type="file" id="fi" hidden>

<script>
/* ===== 存储：IndexedDB + localStorage 备份 ===== */
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const DEF_CFG={min:5,max:40,cmin:1,cmax:3,emoji:20,quote:20,pat:13,transfer:13,accept:80,tron:true,mlike:80,mcm:60,mrep:50,mdmin:1,mdmax:5,mgap:10,mprob:60,mcmin:1,mcmax:3,mimg:30,mpin:true,callp:5,calla:80,pmin:1,pmax:3,dgap:24,dprob:70,dsmin:2,dsmax:5,lmin:1,lmax:5,lreply:70,lgap:48,lprob:50,lcmin:6,lcmax:14,lpin:true,tgap:12,tprob:60,tnmin:1,tnmax:2,tcmin:1,tcmax:3,tdays:3,tpin:true,qprob:10,qgap:20,qexp:60,qn:1};
let G={cards:[],groups:[{id:'g0',name:'默认',on:true}],msgs:[],letters:[],diary:[],moms:[],stickers:[],
  prof:{name:'对方',avatar:'',me:'我',myAvatar:''},cfg:{...DEF_CFG},font:'',bg:'',chatBg:'',sys:{keep:false,notify:false},unread:0};
const kv={db:null,
  open(){return new Promise(r=>{const f=v=>r(v);setTimeout(()=>f(false),2000);try{const q=indexedDB.open('zkhome',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{kv.db=q.result;f(true)};q.onerror=()=>f(false)}catch(e){f(false)}})},
  get(k){return new Promise(r=>{if(!kv.db)return r(null);const q=kv.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result??null);q.onerror=()=>r(null)})},
  set(k,v){return new Promise(r=>{if(!kv.db)return r(false);const t=kv.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>r(true);t.onerror=()=>r(false)})}};
let tm;const save=()=>{clearTimeout(tm);tm=setTimeout(flush,250)};
function flush(){try{localStorage.setItem('zkhome_lite',JSON.stringify({cards:G.cards,groups:G.groups,cfg:G.cfg,todos:G.todos||[],prof:{...G.prof,avatar:'',myAvatar:''}}))}catch(e){}kv.set('state',G)}
addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>document.visibilityState==='hidden'&&flush());
const toast=t=>{const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1600)};

/* ===== 图标 ===== */
const IC={
chat:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>',
cards:'<rect x="4" y="6" width="12" height="14" rx="2"/><path d="M8 3h10a2 2 0 012 2v12"/><path d="M7.5 11h5M7.5 14h3"/>',
letter:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 8l9 6 9-6"/>',
diary:'<path d="M6 3h12v18H6z"/><path d="M9 3v18M12 8h3M12 12h3"/>',
pyq:'<circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16"/><path d="M6 7c4 2 8 2 12 0M6 17c4-2 8-2 12 0"/>',
sticker:'<circle cx="12" cy="12" r="9"/><path d="M8 14c1 2 7 2 8 0M9 9.5v.5M15 9.5v.5"/>',
look:'<path d="M12 3c4 5 6 8 6 11a6 6 0 01-12 0c0-3 2-6 6-11z"/>',
data:'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3 3 7 3s7-1.3 7-3"/>',
cfg:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>'};
const svg=k=>`<svg viewBox="0 0 24 24">${IC[k]}</svg>`;
const APPS=[['chat','聊天'],['cards','字卡库'],['letter','写信'],['diary','日记'],['pyq','朋友圈'],['sticker','表情包'],['look','外观'],['cfg','设置'],['data','数据']];
const DOCK=['chat','letter','pyq','data'];
function homeInit(){
  const mk=k=>{const n=APPS.find(a=>a[0]===k);return `<div class="app" data-app="${k}"><div class="ic glass">${svg(k)}${k==='chat'?'<i class="bd" id="bd"></i>':k==='pyq'?'<i class="bd" id="bd-pyq"></i>':''}</div>${n[1]}</div>`};
  $('apps').innerHTML=APPS.filter(a=>!DOCK.includes(a[0])||a[0]==='data'&&false).map(a=>mk(a[0])).join('');
  $('dock').innerHTML=DOCK.map(mk).join('');
  calDraw();momBadge();
}
function calDraw(){
  const d=new Date(),y=d.getFullYear(),m=d.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),pn=new Date(y,m,0).getDate();
  const L=todos().filter(t=>!t.done),hs=new Set(L.map(t=>t.date)),tn=L.filter(t=>t.date===ymd(d)).length;
  let h=`<div class="t">MONTHLY VIEW</div><div class="y">${y}年${m+1}月</div><div class="cal">`+'日一二三四五六'.split('').map(x=>`<b>${x}</b>`).join('');
  for(let i=f-1;i>=0;i--)h+=`<i class="o">${pn-i}</i>`;
  for(let i=1;i<=n;i++){const k=ymd(new Date(y,m,i));h+=`<i data-d="${k}" class="${i===d.getDate()?'n':''}${hs.has(k)?' h':''}">${i}</i>`}
  const rest=(7-(f+n)%7)%7;for(let i=1;i<=rest;i++)h+=`<i class="o">${i}</i>`;
  $('calw').innerHTML=h+`</div><div class="tdn">${tn?'今天还有 '+tn+' 项待办':'今天没有待办'} ›</div>`;
}
$('calw').addEventListener('click',e=>{const i=e.target.closest('i[data-d]');openTodo(i?i.dataset.d:undefined)});

/* ===== 路由 ===== */
const stack=[];
function open(id,fn){document.querySelectorAll('.pg.on').forEach(p=>p.classList.remove('on'));$(id).classList.add('on');fn&&fn();}
function back(){document.querySelectorAll('.pg.on').forEach(p=>p.classList.remove('on'))}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-app]');if(a){go(a.dataset.app);return}
  if(e.target.closest('[data-back]'))back();
});
function go(k){({chat:openChat,cards:openCards,letter:openLetter,diary:openDiary,pyq:openMom,sticker:openStk,look:openLook,cfg:openCfg,data:openData})[k]()}
function gen(title,add){open('p-gen');$('gt').textContent=title;$('gadd').style.visibility=add?'visible':'hidden';$('gadd').onclick=add||null;return $('gb')}
function dlg(html,after){$('mask').dataset.lock='';qzOpen=null;$('box').innerHTML=html;$('mask').classList.add('on');after&&after($('box'))}
let qzOpen=null;
const shut=()=>{$('mask').classList.remove('on');$('mask').dataset.lock='';qzOpen=null};
$('mask').addEventListener('click',e=>{if(e.target===$('mask')&&!$('mask').dataset.lock)shut()});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pickImg(cb,max=900){const f=$('fi');f.accept='image/*';f.onchange=()=>{const x=f.files[0];f.value='';if(!x)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(x)};f.click()}
const fmt=t=>{const d=new Date(t);return`${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};

/* ===== 聊天 ===== */
let typing=false,quote=null;
function avHtml(s){return s?`<img src="${s}">`:`<svg viewBox="0 0 24 24" style="width:60%;fill:#fff"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-3 0-8 1.5-8 4v2h16v-2c0-2.5-5-4-8-4z"/></svg>`}
function openChat(){open('p-chat',()=>{G.unread=0;badge();save();$('cname').textContent=G.prof.name;renderMsgs()})}
function msgHtml(m,i){
  const h=msgCore(m,i);if(m.type==='call'||m.type==='pat')return h;
  const c=m.mine?'s':'t';
  return`<div class="mr ${c}"><div class="av">${avHtml(m.mine?G.prof.myAvatar:G.prof.avatar)}</div>${h}</div>`}
function msgCore(m,i){
  if(m.type==='call')return`<div class="ds">${esc(m.text)}</div>`;
  if(m.type==='transfer'||m.type==='redpacket')return payHtml(m,i);
  if(m.type==='pat')return`<div class="ds">${esc(m.text)}</div>`;
  if(m.type==='quiz')return`<div class="m s qz" data-i="${i}">${m.title?`<div class="qzt">${esc(m.title)}</div>`:''}${m.qs.map((q,qi)=>{const sel=m.st==='done'?m.ans[qi]:[];return`<div class="qzq"><div class="qzh">${qi+1}. ${esc(q.q)}<small>${q.t==='multi'?'多选':'单选'}</small></div>${q.o.map((o,oi)=>`<div class="qzo${sel.includes(oi)?' on':''}">${sel.includes(oi)?'✓ ':''}${esc(o)}</div>`).join('')}</div>`}).join('')}<div class="qzf">${m.st==='done'?'对方已回答':'等待对方回答…'}</div></div>`;
  if(m.type==='quizq')return`<div class="m t qz" data-i="${i}"><div class="qzt">问卷</div>${m.qs.map((q,qi)=>`<div class="qzq"><div class="qzh">${qi+1}. ${esc(q.q)}</div>${m.st==='done'?`<div class="qza">${esc(q.a)}</div>`:''}</div>`).join('')}<div class="qzf">${m.st==='open'?`<span class="qcd" data-exp="${m.exp}">${Math.max(0,Math.ceil((m.exp-Date.now())/1000))}秒后失效</span> · 点击回答`:m.st==='done'?'已回答':'已失效，不能回答'}</div></div>`;
  const c=m.mine?'s':'t';let b='';
  if(m.reply)b+=`<div class="q">${esc(m.reply)}</div>`;
  if(m.type==='image')return`<div class="m ${c} pic${m.st?' stk':''}" data-i="${i}"><img src="${m.src}"></div>`;
  if(m.type==='emoji')return`<div class="m ${c} em" data-i="${i}">${esc(m.text)}</div>`;
  return`<div class="m ${c}" data-i="${i}">${b}${esc(m.text)}</div>`}
function renderMsgs(){
  let h='',pd='';
  G.msgs.forEach((m,i)=>{if(m.type==='quizq'&&m.st==='open')return;const d=new Date(m.t).toDateString();if(d!==pd){pd=d;h+=`<div class="ds">${fmt(m.t)}</div>`}h+=msgHtml(m,i)});
  if(typing)h+=`<div class="ds">正在输入…</div>`;
  $('msgs').innerHTML=h;const b=$('msgbody');b.scrollTop=b.scrollHeight}
function push(m){m.t=Date.now();m.id=uid();G.msgs.push(m);const inChat=$('p-chat').classList.contains('on');
  if(!m.mine){if(!inChat||document.visibilityState!=='visible'){G.unread=(G.unread||0)+1;badge()}notifyTxt(m.type==='call'?m.text:pv(m))}
  save();if(inChat)renderMsgs()}
$('snd').onclick=send;
function send(){
  const v=$('ta').value.trim();$('ta').value='';
  if(v){const m={mine:true,text:v};if(quote){m.reply=quote;quote=null}push(m)}
  reply()}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pool=()=>{const on=new Set(G.groups.filter(g=>g.on).map(g=>g.id));return G.cards.filter(c=>c.on!==false&&on.has(c.group))};
async function reply(){
  if(typing)return;const p=pool();if(!p.length&&!G.stickers.length){toast('先去字卡库添加字卡');return}
  const c=G.cfg;typing=true;renderMsgs();
  await sleep(Math.max(0.5,c.min+Math.random()*(c.max-c.min))*(location.hash==='#fast'?20:1000)/1);
  const n=Math.min(p.length+G.stickers.length,c.cmin+Math.floor(Math.random()*(c.cmax-c.cmin+1)));
  const texts=p.filter(x=>x.type==='text'),pics=p.filter(x=>x.type!=='text').concat(G.stickers.map(x=>({type:'image',content:x,st:1})));
  for(let i=0;i<n;i++){
    typing=true;renderMsgs();await sleep(700+Math.random()*900);typing=false;
    const useMedia=pics.length&&Math.random()*100<c.emoji||!texts.length;
    const src=useMedia?pics:texts,k=src[Math.floor(Math.random()*src.length)];if(!k)continue;
    const m={mine:false};
    if(k.type==='image'){m.type='image';m.src=k.content;if(k.st)m.st=1}else if(k.type==='emoji'){m.type='emoji';m.text=k.content}else{m.text=k.content;
      if(Math.random()*100<c.quote){const mine=G.msgs.filter(x=>x.mine&&x.text).slice(-3);if(mine.length)m.reply=mine[Math.floor(Math.random()*mine.length)].text.slice(0,40)}}
    push(m)}
  typing=false;
  if(c.tron!==false&&Math.random()*100<c.transfer){await sleep(900+Math.random()*900);push({mine:false,type:'transfer',amount:AMT[Math.floor(Math.random()*AMT.length)],note:'',status:'pending'})}
  renderMsgs();
  if(!call&&Math.random()*100<c.callp)setTimeout(ring,1500)}
const v0=()=>false;
$('plus').onclick=()=>dlg(`<div class="sheet"><button class="btn" id="a1">发送图片</button><button class="btn" id="a2">发送表情包</button><button class="btn" id="a3">发送表情符号</button>${G.cfg.tron!==false?'<button class="btn" id="a5">转账</button>':''}<button class="btn" id="a6">发问卷（对方回答）</button><button class="btn" id="a4">空发送（让对方主动说话）</button></div>`,b=>{
  b.querySelector('#a1').onclick=()=>{shut();pickImg(s=>{push({mine:true,type:'image',src:s});reply()})};
  b.querySelector('#a2').onclick=()=>{shut();showStk(true)};
  b.querySelector('#a3').onclick=()=>{b.innerHTML=`<div class="row">${'😀 🥺 😭 😡 ❤️ 💙 🌙 ✨ 🌸 🐱 🐰 🫶'.split(' ').map(e=>`<span style="font-size:32px" data-e="${e}">${e}</span>`).join('')}</div>`;b.onclick=e=>{const t=e.target.dataset.e;if(t){shut();b.onclick=null;push({mine:true,type:'emoji',text:t});reply()}}};
  b.querySelector('#a4').onclick=()=>{shut();reply()};
  b.querySelector('#a6').onclick=()=>{shut();quizDlg()};
  const a5=b.querySelector('#a5');if(a5)a5.onclick=()=>payDlg()});

function qItemDlg(x){

/* 我发问卷，对方单选/多选作答 */
function quizDlg(){
  let title='',dmin=3,dmax=10,qs=[{q:'',t:'single',o:['','']}],foc=null;
  const draw=()=>dlg(`<div style="font-weight:700;margin-bottom:10px">发问卷</div><input class="qi" id="qt" placeholder="问卷标题（可不填）" value="${esc(title)}">${qs.map((x,i)=>`<div class="qc"><div class="qh"><span>Q${i+1}</span>${qs.length>1?`<button class="qx" data-rmq="${i}">删除问题</button>`:'<span></span>'}</div><input class="qi qq" data-qi="${i}" placeholder="问题，例如：晚饭吃什么" value="${esc(x.q)}">${x.o.map((o,oi)=>`<div class="qor"><input class="qi qo" data-qi="${i}" data-oi="${oi}" placeholder="选项 ${oi+1}" value="${esc(o)}"><button class="ox" data-rmo="${oi}" data-qi="${i}">✕</button></div>`).join('')}<button class="qad" data-ao="${i}">＋ 添加选项</button><div class="qseg"><span class="${x.t==='single'?'on':''}" data-t="single" data-qi="${i}">单选</span><span class="${x.t==='multi'?'on':''}" data-t="multi" data-qi="${i}">多选</span></div></div>`).join('')}<button class="qaq" id="qadd">＋ 添加问题</button><div class="row" style="flex-wrap:nowrap;align-items:center"><span style="white-space:nowrap">对方用时</span><input class="qi" id="qmin" type="number" style="margin:0;width:64px;padding:10px" value="${dmin}"><span>到</span><input class="qi" id="qmax" type="number" style="margin:0;width:64px;padding:10px" value="${dmax}"><span>秒</span></div><button class="btn p" id="qsend">发送</button>`,b=>{
    const sync=()=>{title=b.querySelector('#qt').value;b.querySelectorAll('.qq').forEach(e=>qs[+e.dataset.qi].q=e.value);b.querySelectorAll('.qo').forEach(e=>qs[+e.dataset.qi].o[+e.dataset.oi]=e.value);dmin=Math.max(0,+b.querySelector('#qmin').value||0);dmax=Math.max(dmin,+b.querySelector('#qmax').value||0)};
    if(foc){const e=b.querySelector(foc);foc=null;if(e)e.focus()}
    b.onclick=e=>{const t=e.target.closest('button,span[data-t]')||e.target,d=t.dataset;
      if(d.t){sync();qs[+d.qi].t=d.t;draw()}
      else if(d.rmq!==undefined){sync();qs.splice(+d.rmq,1);draw()}
      else if(d.rmo!==undefined){sync();const q=qs[+d.qi];if(q.o.length>2)q.o.splice(+d.rmo,1);else q.o[+d.rmo]='';draw()}
      else if(d.ao!==undefined){sync();const q=qs[+d.ao];if(q.o.length>=8)return toast('最多 8 个选项');q.o.push('');foc=`.qo[data-qi="${d.ao}"][data-oi="${q.o.length-1}"]`;draw()}
      else if(t.id==='qadd'){sync();if(qs.length>=10)return toast('最多 10 个问题');qs.push({q:'',t:'single',o:['','']});foc=`.qq[data-qi="${qs.length-1}"]`;draw()}
      else if(t.id==='qsend'){sync();
        const out=[];for(let i=0;i<qs.length;i++){const q=qs[i].q.trim();const o=[...new Set(qs[i].o.map(s=>s.trim()).filter(Boolean))];
          if(!q)return toast(`第 ${i+1} 题还没写问题`);if(o.length<2)return toast(`第 ${i+1} 题至少 2 个选项`);
          out.push({q,t:qs[i].t,o})}
        const dd=dmin+Math.random()*(dmax-dmin);
        shut();push({mine:true,type:'quiz',title:title.trim(),qs:out,dmin,dmax,st:'wait',due:Date.now()+dd*1000,ans:null})}}})
  draw()}
function quizPick(q){const n=q.o.length;if(q.t!=='multi')return[Math.floor(Math.random()*n)];
  const idx=[...Array(n).keys()].sort(()=>Math.random()-.5);return idx.slice(0,1+Math.floor(Math.random()*n)).sort((a,b)=>a-b)}
/* 对方按概率发问卷，我用文字回答，超时失效 */
function sendQuizQ(){
  const ps=QP().filter(x=>x.on!==false);if(!ps.length)return false;
  const n=Math.min(ps.length,Math.max(1,Math.round(G.cfg.qn||1))),pick=[...ps].sort(()=>Math.random()-.5).slice(0,n);
  const m={mine:false,type:'quizq',qs:pick.map(x=>({q:x.text,a:''})),st:'open',exp:Date.now()+Math.max(1,G.cfg.qexp||60)*1000};
  push(m);
  if($('p-chat').classList.contains('on')&&document.visibilityState==='visible'&&!$('mask').classList.contains('on'))quizAnswer(m);
  return true}
function quizAnswer(m){
  if(m.st==='done')return toast('已经回答过了');
  if(m.st!=='open'||Date.now()>m.exp){if(m.st==='open'){m.st='expired';save();renderMsgs()}return toast('问卷已失效，不能回答')}
  dlg(`<div style="font-weight:700;margin-bottom:4px">问卷</div><div class="ds" style="text-align:left;margin-bottom:10px"><span class="qcd" data-exp="${m.exp}">${Math.max(0,Math.ceil((m.exp-Date.now())/1000))}秒后失效</span></div>${m.qs.map((q,i)=>`<div style="margin-bottom:4px">${i+1}. ${esc(q.q)}</div><textarea class="ta qans" data-qi="${i}" style="min-height:70px" placeholder="写下你的回答"></textarea>`).join('')}<button class="btn p" id="qok">提交</button>`,b=>{
    $('mask').dataset.lock='1';qzOpen=m;
    b.querySelector('.qans').focus();
    b.querySelector('#qok').onclick=()=>{
      if(Date.now()>m.exp){m.st='expired';save();shut();renderMsgs();return toast('问卷已失效，不能回答')}
      const as=[...b.querySelectorAll('.qans')].map(e=>e.value.trim());if(as.some(a=>!a))return toast('每道题都要回答');
      as.forEach((a,i)=>m.qs[i].a=a);m.st='done';save();shut();renderMsgs()}})}
let qLast=Date.now();
function quizRandom(){
  const c=G.cfg,now=Date.now();if(now-qLast<Math.max(1,c.qgap||20)*1000)return;qLast=now;
  if(!$('p-chat').classList.contains('on')||document.visibilityState!=='visible'||typing||$('mask').classList.contains('on'))return;
  if(G.msgs.some(x=>x.type==='quizq'&&x.st==='open'))return;
  if(Math.random()*100<(c.qprob||0))sendQuizQ()}
function tickQuiz(){quizRandom();
  const now=Date.now();let ch=0;
  G.msgs.slice().forEach(m=>{
    if(m.type==='quiz'&&m.st==='wait'&&m.due<=now){m.ans=m.qs.map(quizPick);m.st='done';ch=1;push({mine:false,type:'pat',text:'对方回答了问卷'+(m.title?'「'+m.title+'」':'')})}
    if(m.type==='quizq'&&m.st==='open'&&m.exp<=now){m.st='expired';ch=1;if(qzOpen===m){shut();toast('问卷已失效')}}});
  const pend=G.msgs.find(x=>x.type==='quizq'&&x.st==='open'&&x.exp>now);
  if(pend&&$('p-chat').classList.contains('on')&&document.visibilityState==='visible'&&!$('mask').classList.contains('on'))quizAnswer(pend);
  if(ch){save();if($('p-chat').classList.contains('on'))renderMsgs()}
  document.querySelectorAll('.qcd[data-exp]').forEach(e=>{const s=Math.ceil((+e.dataset.exp-now)/1000);e.textContent=s>0?s+'秒后失效':'已失效'})}


function openCards(){

    else if(t.id==='mg'){const g0=G.groups.find(x=>x.id===curG);dlg(`<input class="ti" id="gn" value="${esc(g0.name)}"><div class="row"><button class="btn" id="tg">${g0.on?'停用':'启用'}</button><button class="btn p" id="ok">改名</button><button class="btn" id="dl">删除</button></div>`,x=>{

function cardDlg(k){

/* ===== 写信 ===== */
/* ===== 拼字卡：每句拼几张、一共写几句 ===== */
const rint=(a,b)=>{a=Math.max(1,Math.round(a)||1);b=Math.max(a,Math.round(b)||a);return a+Math.floor(Math.random()*(b-a+1))};
function pinSent(texts,k){
  const a=[];for(let i=0;i<k;i++)a.push(texts[Math.floor(Math.random()*texts.length)].content.trim());
  const end=/[。！？!?，,、…~～.]$/;
  return a.map((x,i)=>i<a.length-1?x.replace(/[。！？!?，,、.…~～]+$/,''):x).join('，')+(end.test(a[a.length-1])?'':'。')}
function composeText(sa,sb,nl){
  const t=pool().filter(c=>c.type==='text');if(!t.length)return '';
  const n=rint(sa,sb),c=G.cfg;let o='';
  for(let i=0;i<n;i++){o+=pinSent(t,rint(c.pmin,c.pmax));if(i<n-1&&Math.random()<nl)o+='\n'}
  return o}
const onPage=n=>$('p-gen').classList.contains('on')&&$('gt').textContent===n;

/* ===== 传信：我发出的 / 对方发出的 ===== */
let lTab='in';
function composeLetter(){
  const t=pool().filter(c=>c.type==='text');if(!t.length)return '';
  const c=G.cfg,n=rint(c.lcmin,c.lcmax),pick=()=>t[Math.floor(Math.random()*t.length)];
  if(!c.lpin){const a=[];for(let i=0;i<n;i++)a.push(pick().content.trim());return a.join('\n')}
  let o='',left=n;
  while(left>0){const k=Math.min(left,rint(c.pmin,c.pmax));o+=pinSent(t,k);left-=k;if(left>0&&Math.random()<.5)o+='\n'}
  return o}
/* 全屏文档页：读信 / 写信 / 读日记 / 写日记 */
let docActs={};
const hmOf=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const dLong=t=>{const d=new Date(t);return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 周${WK[d.getDay()]}`};
function docOpen(title,html,acts,mount){
  docActs={};$('doc-title').textContent=title;$('doc-body').innerHTML=html;
  $('doc-act').innerHTML=acts.map(a=>{docActs[a.k]=a.f;return `<button class="dact${a.p?' p':''}" data-a="${a.k}">${a.t}</button>`}).join('');
  $('p-doc').classList.add('on');$('doc-body').scrollTop=0;if(mount)mount($('doc-body'))}
const docClose=()=>$('p-doc').classList.remove('on');
$('doc-back').onclick=docClose;
$('doc-act').onclick=e=>{const b=e.target.closest('[data-a]');if(b&&docActs[b.dataset.a])docActs[b.dataset.a]()};
const autoH=ta=>{ta.style.height='auto';ta.style.height=Math.max(ta.scrollHeight,innerHeight*.38)+'px'};
const ENV='<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/></svg>';

function openLetter(){
  const b=gen('写信',()=>writeLetter());
  const draw=()=>{
    const inn=G.letters.filter(l=>!l.mine),out=G.letters.filter(l=>l.mine),nw=inn.filter(l=>l.seen===false).length;
    const L=(lTab==='in'?inn:out).slice().sort((x,y)=>y.t-x.t);
    let h=`<div class="row"><span class="chip${lTab==='in'?' on':''}" data-t="in">对方发出的${nw?' · '+nw+' 封新':''}</span><span class="chip${lTab==='out'?' on':''}" data-t="out">我发出的</span></div>`;
    h+=L.map(l=>{
      let tag;
      if(l.mine){const w=(G.lq||[]).some(q=>q.to===l.id);tag=w?'等待回信中…':l.st==='replied'?'对方已回信':l.st==='none'?'对方没有回信':'已寄出'}
      else tag=l.seen===false?'新来信':l.replied?'已回复':'';
      return `<div class="lc glass${l.seen===false?' new':''}" data-l="${l.id}"><div class="env">${ENV}</div><div class="lm"><div class="lt">${esc(l.title||'无题')}${l.seen===false?'<i class="nd"></i>':''}</div><div class="lp">${esc(l.body)}</div><div class="lf">${tag?tag+' · ':''}${dLong(l.t)} ${hmOf(l.t)}</div></div></div>`}).join('')||`<div class="ds" style="text-align:center;padding:30px">${lTab==='in'?'对方还没来信':'还没发出过信'}</div>`;
    b.innerHTML=h};
  b.onclick=e=>{
    const t=e.target.closest('[data-t]');if(t){lTab=t.dataset.t;draw();return}
    const c=e.target.closest('[data-l]');if(!c)return;const l=G.letters.find(x=>x.id===c.dataset.l);
    if(l.seen===false){l.seen=true;save();draw()}
    docLetter(l)};
  window.__ldraw=draw;draw()}
function docLetter(l){
  const to=l.mine?G.prof.name:G.prof.me,from=l.mine?G.prof.me:G.prof.name,av=l.mine?G.prof.myAvatar:G.prof.avatar;
  const html=`<div class="paper"><div class="pmeta">${dLong(l.t)} · ${hmOf(l.t)}</div><h1 class="ptitle">${esc(l.title||'无题')}</h1><div class="pto">致 ${esc(to)}：</div><div class="pbody">${esc(l.body)}</div><div class="psign"><div class="av">${avHtml(av)}</div><span>${esc(from)}</span></div></div>`;
  const acts=[];
  if(!l.mine)acts.push({k:'r',t:'回信',p:1,f:()=>{docClose();setTimeout(()=>writeLetter(l),60)}});
  acts.push({k:'d',t:'删除',f:()=>{if(!confirm('删除这封信？'))return;G.letters=G.letters.filter(z=>z!==l);G.lq=(G.lq||[]).filter(q=>q.to!==l.id);save();docClose();if(window.__ldraw)window.__ldraw()}});
  docOpen(l.mine?'我寄出的信':'对方的来信',html,acts)}
function writeLetter(re){
  const html=`<div class="paper"><div class="pmeta">${dLong(Date.now())}${re?' · 回复《'+esc(re.title||'无题')+'》':''}</div><input class="ptitle-in" id="lt" placeholder="标题" value="${re?esc('回：'+(re.title||'无题')):''}"><div class="pto">致 ${esc(G.prof.name)}：</div><textarea class="ptxt pbody" id="lb" placeholder="写点什么…"></textarea><div class="psign"><div class="av">${avHtml(G.prof.myAvatar)}</div><span>${esc(G.prof.me)}</span></div></div>`;
  const send=()=>{
    const body=$('lb').value.trim();if(!body){toast('写点内容吧');return}
    const l={id:uid(),mine:true,title:$('lt').value,body,t:Date.now()};
    if(re){l.re=re.id;re.replied=true}
    G.letters.push(l);
    const c=G.cfg,m=(c.lmin+Math.random()*Math.max(0,c.lmax-c.lmin))*60000;
    (G.lq=G.lq||[]).push({id:uid(),to:l.id,due:Date.now()+m});
    lTab='out';save();docClose();if(onPage('写信'))window.__ldraw();setTimeout(tickLetters,50)};
  docOpen('写信',html,[{k:'s',t:'寄出',p:1,f:send}],b=>{const ta=b.querySelector('#lb');ta.oninput=()=>autoH(ta);autoH(ta);setTimeout(()=>ta.focus(),250)})}
function tickLetters(){
  const q=G.lq||[],now=Date.now(),due=q.filter(x=>x.due<=now);if(!due.length)return;
  G.lq=q.filter(x=>x.due>now);let got=0;
  due.forEach(x=>{const mine=G.letters.find(l=>l.id===x.to);if(!mine)return;
    const body=Math.random()*100<G.cfg.lreply?composeLetter():'';
    if(!body){mine.st='none';return}
    mine.st='replied';G.letters.push({id:uid(),mine:false,title:'回信',body,t:Date.now(),re:mine.id,seen:false});got++});
  save();if(onPage('写信'))window.__ldraw();
  if(got){notifyTxt('回信了');if(document.visibilityState==='visible'&&!$('p-chat').classList.contains('on'))toast('收到一封回信')}}
function tickLetterOut(){
  const c=G.cfg;if(!c.lgap)return;
  const last=Math.max(G.lchk||0,...G.letters.filter(l=>!l.mine&&!l.re).map(l=>l.t));
  if(!G.lchk&&!last){G.lchk=Date.now();save();return}
  if(Date.now()-last<c.lgap*3600000)return;
  G.lchk=Date.now();
  const body=Math.random()*100<c.lprob?composeLetter():'';
  if(!body){save();return}
  G.letters.push({id:uid(),mine:false,title:'来信',body,t:Date.now(),seen:false});save();
  if(onPage('写信'))window.__ldraw();notifyTxt('给你写了一封信')}

/* ===== 日记：双方都能写，带日期，对方用字卡拼 ===== */
let dFlt='all';
const isMine=d=>d.mine!==false;
function writeOtherDiary(){
  const body=composeText(G.cfg.dsmin,G.cfg.dsmax,.35);
  if(!body){toast('先去字卡库添加字卡');return false}
  G.diary.push({id:uid(),body,t:Date.now(),mine:false});save();return true}
function tickDiary(){
  const c=G.cfg;if(!c.dgap)return;
  const last=Math.max(G.dchk||0,...G.diary.filter(d=>!isMine(d)).map(d=>d.t));
  if(!G.dchk&&!last){G.dchk=Date.now();save();return}
  if(Date.now()-last<c.dgap*3600000)return;
  G.dchk=Date.now();
  if(Math.random()*100<c.dprob&&writeOtherDiary()){if(onPage('日记'))window.__ddraw();notifyTxt('写了一篇日记')}else save()}
function openDiary(){
  const b=gen('日记',()=>docDiary());
  const draw=()=>{
    const L=[...G.diary].filter(d=>dFlt==='all'||(dFlt==='me')===isMine(d)).sort((x,y)=>y.t-x.t);
    let h=`<div class="row">${[['all','全部'],['me','我的'],['ta','对方的']].map(([k,n])=>`<span class="chip${dFlt===k?' on':''}" data-f="${k}">${n}</span>`).join('')}<span class="chip" data-ta="1" style="margin-left:auto">让对方写一篇</span></div>`;
    let last='';
    L.forEach(d=>{const dt=new Date(d.t),k=ymd(dt);
      if(k!==last){last=k;h+=`<div class="dh"><b>${dt.getDate()}</b><span>${dt.getFullYear()}年${dt.getMonth()+1}月 · 周${WK[dt.getDay()]}</span></div>`}
      const m=isMine(d);
      h+=`<div class="dc glass${m?'':' ta'}" data-d="${d.id}"><div class="dw"><div class="av" style="width:26px;height:26px">${avHtml(m?G.prof.myAvatar:G.prof.avatar)}</div><b>${esc(m?G.prof.me:G.prof.name)}</b><span style="margin-left:auto;font-size:11px;color:var(--ink2)">${hmOf(d.t)}</span></div><div class="dp">${esc(d.body)}</div></div>`});
    if(!L.length)h+='<div class="ds" style="text-align:center;padding:30px">空</div>';
    b.innerHTML=h};
  b.onclick=e=>{
    const f=e.target.closest('[data-f]');if(f){dFlt=f.dataset.f;draw();return}
    if(e.target.closest('[data-ta]')){if(writeOtherDiary()){dFlt==='me'&&(dFlt='all');draw();toast('对方写好了')}return}
    const c=e.target.closest('[data-d]');if(c)docDiary(G.diary.find(x=>x.id===c.dataset.d))};
  window.__ddraw=draw;draw()}
function docDiary(d,edit){
  const m=d?isMine(d):true,t=d?d.t:Date.now(),dt=new Date(t);
  const head=`<div class="dday"><b>${dt.getDate()}</b><span>${dt.getFullYear()}年${dt.getMonth()+1}月 · 周${WK[dt.getDay()]}<br>${hmOf(t)}</span></div><div class="pwho"><div class="av">${avHtml(m?G.prof.myAvatar:G.prof.avatar)}</div><span>${esc(m?G.prof.me:G.prof.name)} 的日记</span></div>`;
  if(m&&(edit||!d)){
    const save1=()=>{const v=$('dx').value.trim();if(!v){toast('写点内容吧');return}
      if(d)d.body=v;else G.diary.push({id:uid(),body:v,t:Date.now(),mine:true});
      save();window.__ddraw();if(d)docDiary(d);else docClose()};
    docOpen(d?'编辑日记':'写日记',`<div class="paper">${head}<textarea class="ptxt pbody" id="dx" placeholder="今天想写点什么…">${d?esc(d.body):''}</textarea></div>`,[{k:'s',t:'保存',p:1,f:save1}],b=>{const ta=b.querySelector('#dx');ta.oninput=()=>autoH(ta);autoH(ta);setTimeout(()=>ta.focus(),250)});
    return}
  const acts=[];
  if(m)acts.push({k:'e',t:'编辑',f:()=>docDiary(d,true)});
  acts.push({k:'d',t:'删除',f:()=>{if(!confirm('删除这篇日记？'))return;G.diary=G.diary.filter(z=>z!==d);save();docClose();window.__ddraw()}});
  docOpen('日记',`<div class="paper">${head}<div class="pbody">${esc(d.body)}</div></div>`,acts)}

/* ===== 朋友圈 ===== */
const HEART=f=>`<svg viewBox="0 0 24 24" style="width:15px;height:15px;fill:${f?'var(--acc)':'none'};stroke:${f?'var(--acc)':'currentColor'};stroke-width:1.8;stroke-linejoin:round"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/></svg>`;
const mImgs=p=>p.imgs||(p.img?[p.img]:[]);
const mName=w=>w==='me'?G.prof.me:G.prof.name;
const cmWho=c=>c.by||(c.who===G.prof.me?'me':'ta');
function momNorm(){G.moms.forEach(p=>{if(p.likes!==undefined&&p.lt===undefined){p.lt=p.likes?1:0;delete p.likes}if(p.img&&!p.imgs){p.imgs=[p.img];delete p.img}})}
function momBadge(){const b=$('bd-pyq');if(b){const n=G.momNew||0;b.textContent=n>99?'99+':n;b.style.display=n?'grid':'none'}}
function composeShort(a,b,pin){
  const t=pool().filter(c=>c.type==='text');if(!t.length)return '';
  if(!pin)return t[Math.floor(Math.random()*t.length)].content.trim();
  return pinSent(t,rint(a,b)).replace(/。+$/,'')}
function momQueue(p,kind,prob){
  if(Math.random()*100>=prob)return;const c=G.cfg;
  const due=Date.now()+(c.mdmin+Math.random()*Math.max(0,c.mdmax-c.mdmin))*60000;
  (G.mq=G.mq||[]).push({id:uid(),pid:p.id,kind,due});setTimeout(tickMom,Math.max(0,due-Date.now())+300)}
function momNote(t){
  if(onPage('朋友圈'))return;
  G.momNew=(G.momNew||0)+1;momBadge();
  notifyTxt(t.length>30?t.slice(0,30)+'…':t,'pyq')}
function tickMom(){
  const q=G.mq||[],now=Date.now(),due=q.filter(x=>x.due<=now);if(!due.length)return;
  G.mq=q.filter(x=>x.due>now);
  due.forEach(x=>{const p=G.moms.find(m=>m.id===x.pid);if(!p)return;
    if(x.kind==='like'){p.lt=1;momNote('赞了你的朋友圈')}
    else{const text=composeShort(G.cfg.mcmin,G.cfg.mcmax,G.cfg.mpin);if(!text)return;
      const c={by:'ta',text};if(x.kind==='rep')c.to='me';(p.cm=p.cm||[]).push(c);
      momNote(x.kind==='rep'?'回复了你的评论：'+text:'评论了你的朋友圈：'+text)}});
  save();if(onPage('朋友圈'))window.__mdraw()}
function writeOtherMom(){
  const c=G.cfg,pics=pool().filter(x=>x.type==='image').map(x=>x.content).concat(G.stickers);
  let img=pics.length>0&&Math.random()*100<c.mimg;
  const text=img&&Math.random()<.35?'':composeShort(c.mcmin,c.mcmax,c.mpin);
  if(!text){if(pics.length)img=true;else{toast('先去字卡库添加字卡');return false}}
  G.moms.push({id:uid(),mine:false,text,imgs:img?[pics[Math.floor(Math.random()*pics.length)]]:[],t:Date.now(),cm:[],ct:Date.now()});save();
  if(onPage('朋友圈'))window.__mdraw();else momNote(text?'发了一条朋友圈：'+text:'发了一条朋友圈');
  return true}
function tickMomOut(){
  const c=G.cfg;if(!c.mgap)return;
  const last=Math.max(G.mchk||0,0,...G.moms.filter(p=>!p.mine).map(p=>p.ct||0));
  if(!G.mchk&&!last){G.mchk=Date.now();save();return}
  if(Date.now()-last<c.mgap*3600000)return;
  G.mchk=Date.now();
  if(Math.random()*100<c.mprob)writeOtherMom();else save()}

function openMom(){
  G.momNew=0;momBadge();save();
  const b=gen('朋友圈',()=>momCompose());
  const card=p=>{
    const imgs=mImgs(p),n=imgs.length,L=[];if(p.lm)L.push(G.prof.me);if(p.lt)L.push(G.prof.name);
    const cms=(p.cm||[]).map((c,i)=>{const w=cmWho(c);return `<div class="mc" data-ci="${i}"><b>${esc(mName(w))}</b>${c.to?` 回复 <b>${esc(mName(c.to))}</b>`:''}：${esc(c.text)}</div>`}).join('');
    return `<div class="mom mp" data-m="${p.id}"><div class="av">${avHtml(p.mine?G.prof.myAvatar:G.prof.avatar)}</div><div class="mb"><div class="mn">${esc(mName(p.mine?'me':'ta'))}</div>${p.text?`<div class="mt">${esc(p.text)}</div>`:''}${n?`<div class="mg g${n===1?1:n===2||n===4?2:3}">${imgs.map((x,i)=>`<img src="${x}" data-pv="${i}">`).join('')}</div>`:''}<div class="mtm"><span>${fmt(p.t)}</span><button class="mmore" data-a="more">··</button><div class="mpop"><button data-a="like">${p.lm?'取消':'赞'}</button><button data-a="cm">评论</button><button data-a="del">删除</button></div></div>${L.length||cms?`<div class="mx">${L.length?`<div class="ml">♥ ${L.map(esc).join('、')}</div>`:''}${cms}</div>`:''}</div></div>`};
  const head=()=>`<div class="mcov" id="mcv"${G.momCover?` style="background-image:url(${G.momCover})"`:''}><div class="mwho"><span>${esc(G.prof.me)}</span><div class="av">${avHtml(G.prof.myAvatar)}</div></div></div><div class="msig${G.momSign?'':' em'}" id="msign">${G.momSign?esc(G.momSign):'点击设置个性签名'}</div>`;
  const draw=()=>{b.innerHTML=head()+([...G.moms].sort((x,y)=>y.t-x.t).map(card).join('')||'<div class="ds" style="text-align:center;padding:30px">空</div>')};
  b.onclick=e=>{
    const t=e.target;
    if(t.closest('#mcv')){
      dlg(`<div class="sheet"><button class="btn" id="cv">更换背景图</button>${G.momCover?'<button class="btn" id="cr">恢复默认背景</button>':''}</div>`,x=>{
        x.querySelector('#cv').onclick=()=>{shut();pickImg(s=>{G.momCover=s;save();draw()},1200)};
        const cr=x.querySelector('#cr');if(cr)cr.onclick=()=>{G.momCover='';save();shut();draw()}});return}
    if(t.closest('#msign')){
      dlg(`<div style="font-size:13px;color:var(--ink2);margin-bottom:8px">个性签名</div><input class="ti" id="sg" maxlength="60" placeholder="写点什么…" value="${esc(G.momSign||'')}"><button class="btn p" id="ok">保存</button>`,x=>{
        setTimeout(()=>x.querySelector('#sg').focus(),80);
        x.querySelector('#ok').onclick=()=>{G.momSign=x.querySelector('#sg').value.trim();save();shut();draw()}});return}
    const c=t.closest('[data-m]'),more=t.closest('[data-a="more"]');
    b.querySelectorAll('.mom.pop').forEach(x=>{if(!(more&&x===c))x.classList.remove('pop')});
    if(!c)return;const p=G.moms.find(x=>x.id===c.dataset.m);if(!p)return;
    if(more){c.classList.toggle('pop');return}
    const pv=t.closest('[data-pv]');
    if(pv){docOpen('图片',`<img style="width:100%;border-radius:16px" src="${mImgs(p)[+pv.dataset.pv]}">`,[]);return}
    const a=t.closest('[data-a]');
    if(a){
      if(a.dataset.a==='like'){p.lm=p.lm?0:1;save();draw()}
      else if(a.dataset.a==='cm')momCommentDlg(p);
      else if(confirm('删除这条朋友圈？')){G.moms=G.moms.filter(z=>z!==p);G.mq=(G.mq||[]).filter(q=>q.pid!==p.id);save();draw()}
      return}
    const cc=t.closest('[data-ci]');
    if(cc){const cm=p.cm[+cc.dataset.ci];
      if(cmWho(cm)==='ta')momCommentDlg(p,cm);
      else if(confirm('删除这条评论？')){p.cm.splice(+cc.dataset.ci,1);save();draw()}}};
  window.__mdraw=draw;draw()}
function momCommentDlg(p,re){
  dlg(`<div style="font-size:13px;color:var(--ink2);margin-bottom:8px">${re?'回复 '+esc(G.prof.name)+'：':'评论：'}</div><input class="ti" id="ci" placeholder="说点什么…"><button class="btn p" id="ok">发送</button>`,x=>{
    setTimeout(()=>x.querySelector('#ci').focus(),80);
    x.querySelector('#ok').onclick=()=>{
      const v=x.querySelector('#ci').value.trim();if(!v)return;
      const c={by:'me',text:v};if(re)c.to='ta';(p.cm=p.cm||[]).push(c);
      momQueue(p,'rep',G.cfg.mrep);
      save();shut();window.__mdraw()}})}
function momCompose(){
  let imgs=[];
  const html=`<div class="paper" style="min-height:50vh"><div class="pwho"><div class="av">${avHtml(G.prof.myAvatar)}</div><span>${esc(G.prof.me)}</span></div><textarea class="ptxt" id="mt" style="font-size:16px;line-height:1.7;min-height:130px" placeholder="这一刻的想法…"></textarea><div class="mgrid" id="mg"></div><div class="ds" style="margin-top:14px;text-align:left">文字和图片可以只发其中一种，最多 9 张图</div></div>`;
  docOpen('发朋友圈',html,[{k:'s',t:'发布',p:1,f:()=>{

const readImg=(file,max)=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL(file.type==='image/jpeg'?'image/jpeg':'image/png',.85))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)});
function pickImgs(cb,max=320){const f=$('fi');f.accept='image/*';f.multiple=true;f.onchange=async()=>{const fs=[...f.files];f.value='';f.multiple=false;const out=[];for(const x of fs){try{out.push(await readImg(x,max))}catch(e){}}if(out.length)cb(out)};f.click()}

let pillPos=null,pdr=null;
function placePill(){
  const p=$('cpill');if(!p.classList.contains('on'))return;
  const w=p.offsetWidth,h=p.offsetHeight;
  if(!pillPos)pillPos={x:(innerWidth-w)/2,y:60};
  pillPos.x=Math.max(6,Math.min(innerWidth-w-6,pillPos.x));
  pillPos.y=Math.max(6,Math.min(innerHeight-h-6,pillPos.y));
  p.style.left=pillPos.x+'px';p.style.top=pillPos.y+'px';
}
function paintPill(){
  const p=$('cpill');
  if(!call||!call.min){p.classList.remove('on');p.innerHTML='';return}
  p.innerHTML=`<i class="cd"></i><div class="pav">${avHtml(G.prof.avatar)}</div><b>${esc(G.prof.name)}</b><span id="ptm">${cst()}</span>`;
  p.classList.add('on');placePill();
}
(()=>{
  const p=$('cpill');
  p.addEventListener('pointerdown',e=>{if(!pillPos)placePill();pdr={sx:e.clientX,sy:e.clientY,ox:pillPos.x,oy:pillPos.y,mv:false};try{p.setPointerCapture(e.pointerId)}catch(_){}});
  p.addEventListener('pointermove',e=>{if(!pdr)return;const dx=e.clientX-pdr.sx,dy=e.clientY-pdr.sy;
    if(!pdr.mv&&Math.abs(dx)<6&&Math.abs(dy)<6)return;pdr.mv=true;pillPos={x:pdr.ox+dx,y:pdr.oy+dy};placePill()});
  p.addEventListener('pointerup',()=>{const d=pdr;pdr=null;if(d&&!d.mv&&call){call.min=false;paintCall()}});
  p.addEventListener('pointercancel',()=>{pdr=null});
  addEventListener('resize',placePill);
})();
function startCall(){
  if(call)return;call={st:'dial',out:true,lines:[]};paintCall();
  call.dt=setTimeout(()=>{if(!call||call.st!=='dial')return;Math.random()*100<G.cfg.calla?connect():endCall('对方已拒绝')},2000+Math.random()*4000)}
function ring(){
  if(call)return;call={st:'ring',out:false,lines:[]};paintCall();notifyTxt('邀请你通话');
  call.dt=setTimeout(()=>endCall('未接来电'),30000)}
function connect(){
  call.st='on';call.t0=Date.now();paintCall();
  call.tk=setInterval(()=>{if(!call)return;const t=cst();['cstat','ptm'].forEach(i=>{const e=$(i);if(e)e.textContent=t})},1000);}
function endCall(txt){
  if(!call)return;clearInterval(call.tk);clearTimeout(call.to);clearTimeout(call.dt);
  const w=call;call=null;paintCall();
  push({mine:!!w.out,type:'call',text:txt||(w.st==='on'?'通话时长 '+mm(Math.floor((Date.now()-w.t0)/1000)):w.out?'已取消通话':'已拒绝通话')})}
$('callbtn').onclick=startCall;

/* ===== 保活 / 通知 / 弹窗 ===== */
let ka=null;
function silent(){
  const n=8000,b=new ArrayBuffer(44+n),v=new DataView(b),w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);new Uint8Array(b,44).fill(128);
  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
function media(t){if(!('mediaSession' in navigator))return;try{navigator.mediaSession.metadata=new MediaMetadata({title:t||G.prof.name,artist:G.prof.name,artwork:[{src:'icon-512.png',sizes:'512x512',type:'image/png'}]})}catch(e){}}
function keepSet(){
  if(G.sys.keep){if(!ka){ka=new Audio(silent());ka.loop=true}ka.play().catch(()=>{});media()}else if(ka)ka.pause()}
addEventListener('pointerdown',()=>{if(G.sys.keep&&(!ka||ka.paused))keepSet()},{passive:true});
function pv(m){return m.type==='quizq'?'[问卷] 对方发来一份问卷':m.type==='quiz'?'[问卷]':m.type==='image'?'[图片]':m.type==='transfer'?'[转账]':m.type==='redpacket'?'[红包]':m.text||''}
function banner(t,g){
  $('bn').innerHTML=`<div class="av">${avHtml(G.prof.avatar)}</div><div style="min-width:0"><b>${esc(G.prof.name)}</b><div class="bt">${esc(t)}</div></div>`;
  $('bn').dataset.go=g||'chat';$('bn').classList.add('on');clearTimeout(banner.t);banner.t=setTimeout(()=>$('bn').classList.remove('on'),3800)}
$('bn').onclick=()=>{$('bn').classList.remove('on');go($('bn').dataset.go||'chat')};
function notifyTxt(t,g){
  const inChat=$('p-chat').classList.contains('on');
  if(document.visibilityState==='visible'){if(!inChat)banner(t,g)}
  else if(G.sys.notify&&'Notification' in window&&Notification.permission==='granted'){
    const o={body:t,icon:'icon-192.png',tag:'zk',renotify:true};
    if(navigator.serviceWorker)navigator.serviceWorker.getRegistration().then(r=>r?r.showNotification(G.prof.name,o):new Notification(G.prof.name,o)).catch(()=>{});
    else new Notification(G.prof.name,o)}
  if(G.sys.keep)media(t)}
function badge(){const b=$('bd');if(b){b.textContent=G.unread>99?'99+':G.unread;b.style.display=G.unread?'grid':'none'}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&$('p-chat').classList.contains('on')){G.unread=0;badge();save()}});

/* ===== 待办（苹果日历式一天一天的时间轴） ===== */
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const pYmd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const WK='日一二三四五六',CK='<svg viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9"/></svg>';
let tdSel=ymd(new Date()),tdTick=null;
const todos=()=>G.todos||(G.todos=[]);
function openTodo(d){
  open('p-todo',()=>{tdSel=d||ymd(new Date());paintTodo(true)});
  clearInterval(tdTick);tdTick=setInterval(()=>{if($('p-todo').classList.contains('on'))nowLine()},60000)}
function shiftDay(n){const d=pYmd(tdSel);d.setDate(d.getDate()+n);tdSel=ymd(d);paintTodo(true)}
function nowLine(){
  document.querySelectorAll('#td-tl .now').forEach(x=>x.remove());
  const n=new Date();if(tdSel!==ymd(n))return;
  const r=$('td-tl').querySelector(`[data-h="${String(n.getHours()).padStart(2,'0')}"]`);
  if(r){const i=document.createElement('i');i.className='now';i.style.top=(n.getMinutes()/60*100)+'%';r.appendChild(i)}}
function paintTodo(sc){
  const sel=pYmd(tdSel),today=ymd(new Date()),L=todos();
  $('td-title').textContent=`${sel.getFullYear()}年${sel.getMonth()+1}月`;
  const st=new Date(sel);st.setDate(sel.getDate()-sel.getDay());
  let wk='';
  for(let i=0;i<7;i++){const d=new Date(st);d.setDate(st.getDate()+i);const k=ymd(d);
    wk+=`<div class="wd${k===tdSel?' sel':''}${k===today?' tod':''}" data-k="${k}"><b>${WK[i]}</b><i>${d.getDate()}</i><u${L.some(t=>t.date===k&&!t.done)?' class="h"':''}></u></div>`}
  $('td-week').innerHTML=wk;
  const day=L.filter(t=>t.date===tdSel),left=day.filter(t=>!t.done).length;
  $('td-sub').textContent=`${sel.getMonth()+1}月${sel.getDate()}日 周${WK[sel.getDay()]}${tdSel===today?' · 今天':''} · ${day.length?(left?left+' 项未完成':'全部完成'):'没有待办'}`;
  const item=t=>`<div class="ti2${t.done?' dn':''}${t.by==='ta'?' ta':''}" data-id="${t.id}"><button class="ck" data-ck="${t.id}">${t.done?CK:''}</button><div class="tx">${t.time||t.by==='ta'?`<small>${t.time||''}${t.time&&t.by==='ta'?' · ':''}${t.by==='ta'?esc(G.prof.name):''}</small>`:''}${esc(t.text)}</div></div>`;
  let h=`<div class="tl-all"><span>全天</span><div>${day.filter(t=>!t.time).map(item).join('')||'<em>点右上角 + 添加</em>'}</div></div>`;
  for(let H=0;H<24;H++){const hh=String(H).padStart(2,'0');
    h+=`<div class="hr" data-h="${hh}"><span>${hh}:00</span><div>${day.filter(t=>t.time&&t.time.slice(0,2)===hh).sort((a,b)=>a.time.localeCompare(b.time)).map(item).join('')}</div></div>`}
  $('td-tl').innerHTML=h;nowLine();
  if(sc){
    const ts=day.filter(t=>t.time).map(t=>+t.time.slice(0,2));
    const H=tdSel===today?new Date().getHours()-1:ts.length?Math.min(...ts)-1:7;
    const r=$('td-tl').querySelector(`[data-h="${String(Math.max(0,H)).padStart(2,'0')}"]`);
    $('td-body').scrollTop=r?r.offsetTop-6:0}
}
function todoEdit(t,pt){
  if(t&&t.by==='ta'){
    dlg(`<div style="white-space:pre-wrap;line-height:1.7;font-weight:600">${esc(t.text)}</div><small style="display:block;color:var(--ink2);margin:6px 0 12px">${esc(G.prof.name)} 写的 · ${t.date}${t.time?' '+t.time:' · 全天'}</small><div class="row"><button class="btn" id="td">删除</button></div>`,b=>{
      b.querySelector('#td').onclick=()=>{G.todos=todos().filter(z=>z!==t);save();shut();paintTodo();calDraw()}});return}
  const v=t||{date:tdSel,time:pt||'',text:''};
  dlg(`<div style="font-weight:700;margin-bottom:10px">${t?'编辑待办':'新待办'}</div><input class="ti" id="te-x" placeholder="要做什么" value="${esc(v.text)}"><div class="row" style="flex-wrap:nowrap;margin-bottom:0"><input class="ti" id="te-d" type="date" value="${v.date}" style="flex:1;min-width:0"><input class="ti" id="te-t" type="time" value="${v.time}" style="flex:1;min-width:0"></div><small style="color:var(--ink2);display:block;margin:0 4px 12px">时间留空就放在「全天」</small><div class="sheet"><button class="btn p" id="te-s">保存</button>${t?'<button class="btn" id="te-del">删除</button>':''}</div>`,b=>{
    b.querySelector('#te-s').onclick=()=>{
      const x=b.querySelector('#te-x').value.trim();if(!x){toast('写点内容吧');return}
      const d=b.querySelector('#te-d').value||tdSel,tm=b.querySelector('#te-t').value;
      if(t)Object.assign(t,{text:x,date:d,time:tm});else todos().push({id:uid(),text:x,date:d,time:tm,done:false});
      tdSel=d;save();shut();paintTodo(true);calDraw()};
    const dl=b.querySelector('#te-del');
    if(dl)dl.onclick=()=>{G.todos=todos().filter(z=>z!==t);save();shut();paintTodo();calDraw()};
    if(!t)setTimeout(()=>b.querySelector('#te-x').focus(),50)})}
(()=>{
  const pg=$('p-todo');
  pg.addEventListener('click',e=>{
    const ck=e.target.closest('[data-ck]');
    if(ck){const t=todos().find(z=>z.id===ck.dataset.ck);if(t){t.done=!t.done;save();paintTodo();calDraw()}return}
    const it=e.target.closest('.ti2');if(it){todoEdit(todos().find(z=>z.id===it.dataset.id));return}
    const wd=e.target.closest('.wd');if(wd){tdSel=wd.dataset.k;paintTodo(true);return}
    const row=e.target.closest('#td-tl .hr,#td-tl .tl-all');if(row){todoEdit(null,row.dataset.h?row.dataset.h+':00':'')}});
  $('td-add').onclick=()=>todoEdit();
  $('td-prev').onclick=()=>shiftDay(-1);$('td-next').onclick=()=>shiftDay(1);
  $('td-today').onclick=()=>{tdSel=ymd(new Date());paintTodo(true)};
  let sx=0,sy=0;
  pg.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  pg.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>70&&Math.abs(dy)<45&&!$('mask').classList.contains('on'))shiftDay(dx<0?1:-1)},{passive:true});
})();

/* 对方自己往日历里写行程 */
function composeTodo(){
  const t=pool().filter(c=>c.type==='text');if(!t.length)return '';
  const c=G.cfg;
  if(!c.tpin)return t[Math.floor(Math.random()*t.length)].content.trim();
  return pinSent(t,rint(c.tcmin,c.tcmax)).replace(/。+$/,'')}
function writeOtherTodos(n){
  const c=G.cfg,k=n||rint(c.tnmin,c.tnmax);let ok=0;
  for(let i=0;i<k;i++){
    const text=composeTodo();if(!text)break;
    const d=new Date();d.setDate(d.getDate()+Math.floor(Math.random()*(Math.max(0,c.tdays)+1)));
    const timed=Math.random()<.7,hh=String(8+Math.floor(Math.random()*15)).padStart(2,'0'),mm=Math.random()<.5?'00':'30';
    todos().push({id:uid(),date:ymd(d),time:timed?hh+':'+mm:'',text,done:false,by:'ta',ct:Date.now()});ok++}
  if(!ok){toast('先去字卡库添加字卡');return 0}
  save();calDraw();if($('p-todo').classList.contains('on'))paintTodo();return ok}
function tickTodoOut(){
  const c=G.cfg;if(!c.tgap)return;
  const last=Math.max(G.tchk||0,0,...todos().filter(t=>t.by==='ta').map(t=>t.ct||0));
  if(!G.tchk&&!last){G.tchk=Date.now();save();return}
  if(Date.now()-last<c.tgap*3600000)return;
  G.tchk=Date.now();
  if(Math.random()*100<c.tprob){if(writeOtherTodos())notifyTxt('在日历里加了新的行程')}else save()}

/* ===== 启动 ===== */
(async()=>{
  const ok=await kv.open(),s=ok?await kv.get('state'):null;
  if(ok)await loadCustomFont();
  if(s)G={...G,...s,cfg:{...DEF_CFG,...(s.cfg||{})},prof:{...G.prof,...(s.prof||{})},sys:{...G.sys,...(s.sys||{})}};
  else try{const l=JSON.parse(localStorage.getItem('zkhome_lite')||'null');if(l)G={...G,...l}}catch(e){}
  G.cfg={...DEF_CFG,...G.cfg};G.letters=G.letters||[];G.diary=G.diary||[];
  applyLook();homeInit();badge();momNorm();momBadge();tickLetters();tickLetterOut();tickDiary();tickTodoOut();tickMom();tickMomOut();
  tickQuiz();setInterval(tickQuiz,1000);
  setInterval(()=>{tickLetters();tickLetterOut();tickDiary();tickTodoOut();tickMom();tickMomOut()},20000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){tickLetters();tickLetterOut();tickDiary();tickTodoOut();tickMom();tickMomOut()}});
  G.msgs.filter(m=>m.mine&&m.status==='pending').forEach(settle);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
